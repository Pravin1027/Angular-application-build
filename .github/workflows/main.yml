name: Build my angular app

on: 
  push:
    branches: [ main ]

jobs:
    build-angular-app:
     runs-on: ubuntu-latest

     steps:
         - uses: actions/checkout@v4
         - name: Use Node.js
           uses: actions/setup-node@v4
           with:
             node-version: 20

         - name: npm install, build and test
           run: |
            npm install
            npm run build --if-present
            npm test
          
